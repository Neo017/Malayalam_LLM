[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "malayalam-llm"
version = "0.1.0"
description = "Dataset-agnostic training recipes for open Malayalam language models"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Malayalam LLM contributors"}]
dependencies = ["torch>=2.2", "transformers>=4.44", "datasets>=2.20"]

[project.optional-dependencies]
train = ["accelerate>=0.33", "trl>=0.12", "peft>=0.12", "bitsandbytes>=0.43; platform_system == 'Linux'", "sentencepiece>=0.2"]
dev = ["ruff>=0.6", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
