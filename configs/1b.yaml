# Reference settings for an approximately 1B-parameter causal decoder.
# Training scripts accept CLI arguments so no dataset or checkpoint is assumed.
block_size: 2048
per_device_train_batch_size: 1
gradient_accumulation_steps: 32
learning_rate: 2.0e-5
num_train_epochs: 1
warmup_ratio: 0.03
weight_decay: 0.1
bf16: true
gradient_checkpointing: true
logging_steps: 10
save_steps: 500
eval_steps: 500
